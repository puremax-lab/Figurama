name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, gd

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Tests use their own SQLite database, rebuilt from the demo data before each test (tests/AppWebTestCase.php).
      - name: Run tests
        run: php bin/phpunit
